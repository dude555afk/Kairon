name: Kairon Android UI Preview

on:
  push:
    branches:
      - feature/ui-overhaul
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    name: Build limited-permission preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      # UI preview uses upstream's Play Store flavor to omit FOSS-only SMS,
      # notification-listener and APK-installer capabilities. This does not
      # modify the FOSS flavor or remove these features from the source tree.
      - name: Assemble preview APK
        run: ./gradlew :androidApp:assemblePlayStoreDebug --no-daemon --stacktrace
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kairon-ui-preview-apk
          path: androidApp/build/outputs/apk/playStore/debug/*.apk
          if-no-files-found: error
