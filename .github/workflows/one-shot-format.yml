name: One-shot Kotlin format repair

on:
  push:
    branches:
      - feature/remote-github-agent

permissions:
  contents: write

concurrency:
  group: one-shot-format-repair
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/remote-github-agent
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply repository formatter
        run: |
          chmod +x gradlew
          ./gradlew spotlessApply --no-daemon
      - name: Commit formatting and remove this one-shot workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f .github/workflows/one-shot-format.yml
          git config user.name "Kairon Format Repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git commit -m "Apply Spotless formatting"
          git push origin HEAD:feature/remote-github-agent
