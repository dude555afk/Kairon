name: Android Build and Tests

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Validate Android app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android 37 platform and NDK
        run: |
          sdkmanager --channel=3 --install "platforms;android-37.0" "ndk;29.0.14206865"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Verify Java version
        run: java -version

      - name: Check formatting
        run: ./gradlew spotlessCheck --no-daemon --stacktrace

      - name: Run Android host unit tests
        run: ./gradlew :composeApp:testAndroidHostTest --no-daemon --stacktrace

      - name: Run Android screenshot tests
        run: ./gradlew :screenshotTests:testDebugUnitTest --no-daemon --stacktrace

      - name: Build FOSS debug APK
        run: ./gradlew :androidApp:assembleFossDebug --no-daemon --stacktrace

      - name: Upload FOSS debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kairon-foss-debug-apk
          path: androidApp/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
          retention-days: 14
